[project]
name = "youtube-auto-uploader"
version = "0.1.0"
description = "Discover Drive stories and schedule their videos on YouTube"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1,<2", "google-auth>=2,<3", "google-auth-oauthlib>=1,<2", "requests>=2,<3", "portalocker>=3,<4"]

[project.scripts]
youtube-auto-uploader = "youtube_auto_uploader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
